<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento de Produtos e Serviços</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Orçamento</h1>
        <p class="subtitulo">Cadastro de produtos e serviços</p>

        <div class="formulario">

            <div class="campo">
                <label for="produto">Produto ou Serviço</label>
                <input type="text" id="produto" placeholder="Digite o produto ou serviço">
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="1" value="1">
            </div>

            <div class="campo">
                <label for="valor">Valor Unitário</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="R$ 0,00">
            </div>

            <button onclick="adicionarItem()">Adicionar Item</button>

        </div>

        <div class="tabela-container">

            <table>
                <thead>
                    <tr>
                        <th>Produto / Serviço</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                        <th>Subtotal</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="listaItens">
                </tbody>

            </table>

        </div>

        <div class="resumo">

            <div class="campo-desconto">
                <label for="desconto">Desconto (%)</label>

                <input
                    type="number"
                    id="desconto"
                    min="0"
                    max="100"
                    value="0"
                    oninput="calcularTotal()"
                >
            </div>

            <div class="valores">

                <p>
                    <span>Subtotal:</span>
                    <strong id="subtotal">R$ 0,00</strong>
                </p>

                <p>
                    <span>Desconto:</span>
                    <strong id="valorDesconto">R$ 0,00</strong>
                </p>

                <p class="total">
                    <span>Total:</span>
                    <strong id="total">R$ 0,00</strong>
                </p>

            </div>

        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
